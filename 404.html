<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f6f4ef; --ink: #1d2320; --muted: #5d6762; --brand: #1f6f50; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141816; --ink: #ebefe9; --muted: #a3ada7; --brand: #5cc596; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
    a { color: var(--brand); font-weight: 700; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>That page doesn't exist.</p>
    <p><a href="./">Go to the Main Street Ledger homepage</a></p>
  </main>
</body>
</html>
